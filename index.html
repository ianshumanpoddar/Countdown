<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Countdown — 24 Jan 2027</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --bg:#0b0f14;
    --panel:#121821;
    --line:#243040;
    --text:#e7edf3;
    --muted:#7c8ba1;
    --accent:#5ee6c8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .bg-photo{
    position:fixed;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    z-index:0;
    animation:zoomSlow 20s ease-in-out infinite alternate;
  }
  .overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(180deg, rgba(11,15,20,.55) 0%, rgba(11,15,20,.75) 60%, rgba(11,15,20,.92) 100%);
    z-index:1;
  }
  @keyframes zoomSlow{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
  }
  .wrap{
    position:relative;
    z-index:2;
    width:100%;max-width:640px;padding:32px;text-align:center;
  }
  .fade-up{
    opacity:0;
    animation:fadeUp .9s ease forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .target{
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .target span{color:var(--accent);}
  .note{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--accent);
    letter-spacing:0.04em;
    margin:-16px 0 28px;
    opacity:.9;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  .cell{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 6px 14px;
    position:relative;
    overflow:hidden;
  }
  .cell::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:.5;
  }
  .num{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:clamp(28px,7vw,44px);
    line-height:1;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .label{
    margin-top:8px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .done{
    font-size:22px;color:var(--accent);
    font-family:'JetBrains Mono',monospace;
  }
  @media (max-width:420px){
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  .music-btn{
    position:fixed;
    bottom:24px;right:24px;
    z-index:3;
    width:200px;height:200px;
    border-radius:50%;
    background:rgba(18,24,33,.85);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:90px;
    backdrop-filter:blur(6px);
  }
  .eq{
    position:fixed;
    left:0;right:0;bottom:0;
    height:70px;
    z-index:2;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:3px;
    padding:0 4px;
    pointer-events:none;
  }
  .eq span{
    flex:1 1 auto;
    min-height:3px;
    background:linear-gradient(180deg,var(--accent),#2c8f7c);
    border-radius:2px 2px 0 0;
    transition:height .05s linear;
    opacity:.9;
  }
  .vol-slider{
    position:fixed;
    top:20px;
    right:16px;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    background:rgba(18,24,33,.85);
    border:1px solid var(--line);
    border-radius:20px;
    padding:12px 6px;
    backdrop-filter:blur(6px);
  }
  .vol-slider input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:90px;
    height:4px;
    background:var(--line);
    border-radius:2px;
    transform:rotate(-90deg);
    margin:40px -22px;
    outline:none;
  }
  .vol-slider input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    box-shadow:0 0 6px rgba(94,230,200,.6);
  }
  .vol-slider input[type="range"]::-moz-range-thumb{
    width:18px;height:18px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    cursor:pointer;
  }
  .vol-icon{
    font-size:16px;
    color:var(--muted);
  }
</style>
</head>
<body>
  <img class="bg-photo" src="photo.jpeg" alt="Komal and Anshuman">
  <div class="overlay"></div>
  <div class="wrap">
    <div class="target fade-up" style="animation-delay:.3s">Counting down to <span>24 Jan 2027</span></div>
    <div class="note fade-up" style="animation-delay:.45s">Counting down to the day when Komal and Anshuman will circle the sacred fire, exchange eternal vows, and begin a journey of love, dharma, and togetherness—today, tomorrow, and for seven lifetimes.🔥💖</div>
    <div class="grid fade-up" id="grid" style="animation-delay:.6s">
      <div class="cell"><div class="num" id="d">--</div><div class="label">Days</div></div>
      <div class="cell"><div class="num" id="h">--</div><div class="label">Hours</div></div>
      <div class="cell"><div class="num" id="m">--</div><div class="label">Minutes</div></div>
      <div class="cell"><div class="num" id="s">--</div><div class="label">Seconds</div></div>
    </div>
  </div>

  <div class="eq" id="eq"></div>

  <canvas id="fx" style="position:fixed;inset:0;z-index:5;pointer-events:none;"></canvas>

  <audio id="bgm" src="song.mp3" loop autoplay muted playsinline></audio>
  <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🔇</div>
  <div class="vol-slider">
    <span class="vol-icon">🔊</span>
    <input type="range" id="volSlider" min="0" max="100" value="70">
    <span class="vol-icon">🔈</span>
  </div>

<script>
  const target = new Date("2027-01-24T00:00:00");

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = new Date();
    let diff = target - now;

    if (diff <= 0){
      document.getElementById('grid').innerHTML =
        '<div class="done" style="grid-column:1/-1;">Target date reached 🎉</div>';
      clearInterval(timer);
      return;
    }

    const totalSeconds = Math.floor(diff/1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById('d').textContent = days;
    document.getElementById('h').textContent = pad(hours);
    document.getElementById('m').textContent = pad(minutes);
    document.getElementById('s').textContent = pad(seconds);
  }

  tick();
  const timer = setInterval(tick, 1000);

  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('musicBtn');
  const volSlider = document.getElementById('volSlider');
  let isMuted = true;
  let currentVolume = 0.7;

  // Try to start the song silently in the background right away
  bgm.volume = currentVolume;
  bgm.play().catch(()=>{ /* browser may block until first interaction */ });

  function toggleMusic(){
    isMuted = !isMuted;
    musicBtn.textContent = isMuted ? '🔇' : '🔊';
    applyVolume();
    if (!isMuted){
      bgm.play().catch(()=>{});
    }
  }

  function applyVolume(){
    const level = isMuted ? 0 : currentVolume;
    if (gainNode){
      gainNode.gain.value = level;
    } else {
      bgm.volume = level;
      bgm.muted = isMuted;
    }
  }

  volSlider.addEventListener('input', () => {
    currentVolume = volSlider.value / 100;
    if (currentVolume <= 0){
      isMuted = true;
      musicBtn.textContent = '🔇';
    } else if (isMuted){
      isMuted = false;
      musicBtn.textContent = '🔊';
      bgm.play().catch(()=>{});
    }
    applyVolume();
  });

  // Firecracker burst on tap/click
  const fx = document.getElementById('fx');
  const ctx = fx.getContext('2d');
  function resizeFx(){
    fx.width = window.innerWidth;
    fx.height = window.innerHeight;
  }
  resizeFx();
  window.addEventListener('resize', resizeFx);
  window.addEventListener('orientationchange', resizeFx);
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', resizeFx);
  }

  let particles = [];
  const colors = ['#5ee6c8','#ffd166','#ff6b6b','#ffffff','#f4a261','#e63946'];

  function burst(x, y){
    for (let i = 0; i < 28; i++){
      const angle = (Math.PI * 2 * i) / 28 + Math.random()*0.3;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: 2 + Math.random() * 2
      });
    }
  }

  function animateFx(){
    ctx.clearRect(0, 0, fx.width, fx.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06; // gravity
      p.life -= 0.018;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
    requestAnimationFrame(animateFx);
  }
  animateFx();

  function handleTap(e){
    const point = e.touches ? e.touches[0] : e;
    burst(point.clientX, point.clientY);
  }
  document.addEventListener('click', handleTap);
  document.addEventListener('touchstart', handleTap, {passive:true});

  // Audio-reactive equalizer
  const eqContainer = document.getElementById('eq');
  const BAR_COUNT = 24;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++){
    const b = document.createElement('span');
    eqContainer.appendChild(b);
    bars.push(b);
  }

  let audioCtx, analyser, gainNode, dataArray, sourceConnected = false;

  function setupAudioAnalyser(){
    if (sourceConnected) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(bgm);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      gainNode = audioCtx.createGain();
      gainNode.gain.value = isMuted ? 0 : currentVolume;

      source.connect(analyser);
      analyser.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      bgm.muted = false; // volume now fully controlled by gainNode
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      sourceConnected = true;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      bgm.play().catch(()=>{});
      drawEq();
    } catch(e){ /* Web Audio not available, bars stay idle */ }
  }

  function drawEq(){
    requestAnimationFrame(drawEq);
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    for (let i = 0; i < BAR_COUNT; i++){
      const val = dataArray[i % dataArray.length];
      const height = isMuted ? 3 : Math.max(3, (val / 255) * 60);
      bars[i].style.height = height + 'px';
    }
  }

  // Audio analysis needs a user gesture to start on iOS
  document.addEventListener('click', function initAudio(){
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    setupAudioAnalyser();
  }, {once:false});
</script>
</body>
</html>
